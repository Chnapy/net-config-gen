$schema: https://json-schema.org/draft/2020-12/schema
type: object
properties:
  networks:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        description:
          type: string
        wan_ip:
          type: string
          format: ipv4
          pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$
        ddns:
          type: string
        peers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              icon:
                type: string
                minLength: 1
              description:
                type: string
              type:
                type: string
                enum:
                  - router
                  - server
                  - desktop
                  - mediacenter
                  - cloud
              network_entrypoint:
                type: boolean
              lan_ip:
                type: string
                format: ipv4
                pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$
              vpn_ip:
                type: string
                format: ipv4
                pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$
              domain:
                type: string
              access:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum:
                        - ssh
                        - http
                        - tcp
                        - udp
                    port:
                      type: number
                      minimum: 0
                    internal_port:
                      type: number
                      minimum: 0
                    domain_port:
                      type: number
                      minimum: 0
                    domain:
                      type: string
                      minLength: 1
                    ssl:
                      type: boolean
                    expose_outside_vpn:
                      type: boolean
                    port_forward:
                      type: boolean
                  required:
                    - port
                  additionalProperties: false
              services:
                type: array
                items:
                  $ref: "#/$defs/__schema0"
            required:
              - id
              - name
              - icon
              - description
              - type
            additionalProperties: false
      required:
        - id
        - name
        - description
        - wan_ip
        - peers
      additionalProperties: false
required:
  - networks
additionalProperties: false
$defs:
  __schema0:
    type: object
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      icon:
        type: string
        minLength: 1
      description:
        type: string
      type:
        type: string
        enum:
          - docker-container
          - proxmox-lxc
          - proxmox-vm
      role:
        type: string
        enum:
          - reverse-proxy
          - vpn-server
      lan_ip:
        type: string
        format: ipv4
        pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$
      vpn_ip:
        type: string
        format: ipv4
        pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$
      domain:
        type: string
      access:
        type: array
        items:
          type: object
          properties:
            type:
              type: string
              enum:
                - ssh
                - http
                - tcp
                - udp
            port:
              type: number
              minimum: 0
            internal_port:
              type: number
              minimum: 0
            domain_port:
              type: number
              minimum: 0
            domain:
              type: string
              minLength: 1
            ssl:
              type: boolean
            expose_outside_vpn:
              type: boolean
            port_forward:
              type: boolean
          required:
            - port
          additionalProperties: false
      generator:
        anyOf:
          - type: object
            properties:
              type:
                type: string
                const: dnsmasq
              paths:
                type: object
                properties:
                  dnsmasq.conf:
                    type: string
                    minLength: 1
                required:
                  - dnsmasq.conf
                additionalProperties: false
              dns:
                type: array
                items:
                  type: string
                  format: ipv4
                  pattern: ^(?:(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(?:25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])$
              domains:
                type: array
                items:
                  type: object
                  properties:
                    domain:
                      type: string
                      minLength: 1
                    ip_to_use:
                      type: string
                      enum:
                        - wan
                        - lan
                        - vpn
                    service:
                      type: string
                      minLength: 1
                  required:
                    - domain
                    - ip_to_use
                  additionalProperties: false
              anonymize_network:
                type: boolean
            required:
              - type
              - paths
              - dns
              - domains
            additionalProperties: false
          - type: object
            properties:
              type:
                type: string
                const: caddy
              paths:
                type: object
                properties:
                  Caddyfile:
                    type: string
                    minLength: 1
                required:
                  - Caddyfile
                additionalProperties: false
              email:
                type: string
                format: email
                pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              domains:
                type: array
                items:
                  type: string
                  minLength: 1
              anonymize_network:
                type: boolean
            required:
              - type
              - paths
              - email
              - domains
            additionalProperties: false
          - type: object
            properties:
              type:
                type: string
                const: gatus
              mode:
                type: string
                enum:
                  - all
                  - partial
              alerting:
                type: object
                properties:
                  service:
                    type: string
                    minLength: 1
                  topic:
                    type: string
                    minLength: 1
                  token:
                    type: string
                    minLength: 1
                required:
                  - service
                  - topic
                  - token
                additionalProperties: false
              ui:
                type: object
                properties:
                  header:
                    type: string
                    minLength: 1
                  title:
                    type: string
                    minLength: 1
                additionalProperties: false
              paths:
                type: object
                properties:
                  config.yaml:
                    type: string
                    minLength: 1
                required:
                  - config.yaml
                additionalProperties: false
              anonymize_network:
                type: boolean
            required:
              - type
              - mode
              - paths
            additionalProperties: false
          - type: object
            properties:
              type:
                type: string
                const: homepage
              safeMode:
                type: boolean
              paths:
                type: object
                properties:
                  services.yaml:
                    type: string
                    minLength: 1
                required:
                  - services.yaml
                additionalProperties: false
              anonymize_network:
                type: boolean
            required:
              - type
              - paths
            additionalProperties: false
          - type: object
            properties:
              type:
                type: string
                const: homenet
              safeMode:
                type: boolean
              themes:
                type: array
                items:
                  type: string
                  enum:
                    - default
                    - mauve
                    - blue
                    - green
                    - yellow
              paths:
                type: object
                properties:
                  devices.json:
                    type: string
                    minLength: 1
                  metadata.json:
                    type: string
                    minLength: 1
                required:
                  - devices.json
                additionalProperties: false
              anonymize_network:
                type: boolean
            required:
              - type
              - paths
            additionalProperties: false
      services:
        type: array
        items:
          $ref: "#/$defs/__schema0"
    required:
      - id
      - name
      - icon
      - description
    additionalProperties: false
